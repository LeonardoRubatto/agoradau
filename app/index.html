{
"analyses": [
{
"slug": "omnipresence-trump",
"url": "../analyses/omnipresence-trump/index.html",
"title": "Face à l’omniprésence de Trump, les opposants dans la rue",
"title_display": "Face à l’omniprésence de Trump, les opposants dans la rue.",
"dek": "Entre ingérence dans le monde entier et volonté de faire taire les contestations, une véritable omniprésence de Trump.",
"kicker": "International · États-Unis · Pouvoir",
"author": "Yanis Lacote",
"date": "2026-11-23",
"date_display": "Novembre 2026",
"reading_time": "≈ 12 min de lecture",

"cover": null,
"tags": ["International","États-Unis","Pouvoir"],
"closing": null,
"closing_red": null,
"sources": "",
"body": "<p>C’est en grande pompe que les Démocrates ont accueilli la nouvelle de leur victoire aux élections de mi-mandat américaines, les midterms. Ce vote, qui était censé montrer la confiance des Américains envers le gouvernement de Donald Trump,a fait perdre aux républicains la majorité dans les deux chambres du Congrès américain; la Chambre des représentants et le Sénat. Cette victoire du parti démocrate est d’autant plus spectaculaire, témoignant d’une réelle volonté des Américains d’affaiblir l’administration Trump, que des États historiquement considérés comme républicains et conservateurs comme le Texas ou le Kansas se sont teintés en bleu , couleur du parti démocrate.</p>\n<p>On assiste donc à une réelle remise en cause des politiques menées par le président américain. Entre ingérence dans le monde entier, et volonté de faire taire les contestations, on assiste depuis la cérémonie d’investiture du 20 janvier 2025, à une véritable omniprésence de Trump, bien trop souvent accompagnée de violence, que ce soit au sein même du territoire américain ou à l’international.</p>\n<h2 id=\"la-rue-face-à-la-répression\">La rue face à la répression</h2>\n<p>Le mouvement No Kings, principal mouvement de contestation anti-Trump, mobilise de plus en plus de citoyens américains. Deux semaines avant les élections de mi-mandat, on recensait près de 2500 rassemblements dans tous les États-Unis, manifestant contre l’inflation, la guerre en Iran, mal perçue par les Américains, ainsi qu’à propos des accusations de corruption visant l’administration Trump.</p>\n<p>À Minneapolis, ce sont près de 50 000 personnes dans les rues qui ont manifesté contre la politique migratoire. Ces nombreuses manifestations se déroulent sans débordement, les manifestants parvenant à contenir leur colère. Pourtant, les manifesants.es ne sont pas sereins face à la répression policière, suite à de nombreuses interventions brutales d’ICE, police fédérale de l’immigration.</p>\n<blockquote>\n<p>« Peut-être que certains craignent de sortir à cause de la résurgence des actions d’ICE ces dernières semaines en Californie »</p>\n<p>— Manifestantes au mouvement No Kings</p>\n</blockquote>\n<p>Le mouvement No King forme un réseau protéiforme mobilisant de nombreuses personnes dans tous les secteurs possibles.  Dans la sphère juridique, on assiste à une multiplication des recours d’avocats devant les tribunaux pour prendre la défense des victimes de la répression policière et judiciaire. Au sein des villes, on observe d’une part que les locaux mettent en œuvre un système de protection des migrants dans les quartiers en leur fournissant les services de base dont ils ont besoin pour survivre. D’autre part, on compte 4 États et 300 villes se déclarant “sanctuaires” et refusant de coopérer avec la police fédérale sur la question des sans papiers. De plus, des associations comme l’ACLU ( Union Américaine pour les Libertés Civiles) ont saisi la justice pour faire suspendre des décrets anti-immigration.</p>\n<p>L’humour est aussi particulièrement convoqué pour déstabiliser le système en place. À Portland, des militants déguisés en grenouilles ou en dragons dansent, d’autres défilent nus sur des vélos, et certains ont même bloqué les entrées des locaux d’ICE afin de ralentir leurs opérations, et notamment pour les empêcher d’atteindre les lieux de manifestation.</p>\n<p>En réponse à ces revendications et face à ces manifestants pacifiques, Trump n’hésite pas à multiplier les provocations, voire des menaces, à l’encontre des manifestants,. Selon certains observateurs, ces actions viseraient à susciter une réaction violente de la population, qui lui permettrait d’invoquer l’Insurrection Act. Cette loi autorise le président des États-Unis à déployer les forces armées sur le sol américain en cas de circonstances exceptionnelles.</p>\n<p>À l’heure où cet article est rédigé, les élections de mi-mandat ont déjà eu lieu. On aurait pu supposer que Trump, à force de multiplier les provocations, cherchait, en réalité, à perturber voire décaler les élections qui s'annoncent défavorables pour lui.</p>\n<p>En l'occurrence, Trump n’a manifestement pas conservé la confiance des électeurs au cours de ce second mandat. Sur sa plateforme Truth Social, Trump rejette la faute sur ses gouverneurs, affirmant que s’il était sur le bulletin, le parti républicain aurait été largement en tête.</p>\n<p>Trump, en à peine 2 ans de mandat, a donc perdu la confiance d’une grande partie de ses électeurs. On lui reproche entre autres une mauvaise administration du territoire américain, une répression illégitime des manifestations pourtant pacifistes, un traitement inhumain des sans-papiers sur le sol américain. Pour autant, les préoccupations de l’opinion publique américaine ne s'arrêtent pas aux frontières des États-Unis et  bon nombre d'Américains accusent les nombreuses ingérences de leur président sur presque tous les continents, aux lourdes conséquences géopolitiques, économiques et sociales.</p>\n<h2 id=\"l-amérique-latine-une-tentation-dhégémonie\">L’ Amérique Latine: une tentation d’hégémonie</h2>\n<p>L’Amérique Latine, considérée par les États-Unis depuis près de 2 siècles comme leur chassé-gardée exclusif, est la cible de bon nombre d’actions visant à faire perpétuer l’hégémonie étatsunienne dans la région.</p>\n<p>Le quotidien <em>El pais América</em> livre ses inquiétudes vis-à-vis de l’ingérence manifeste de l’administration Trump au Brésil, au Mexique ainsi qu’en Colombie, des puissances régionales restées à gauche, et échappant aux contrôles et aux intérêts des États Unis. C’est le cas très récent du Brésil qui, au cours des élections présidentielles du mois d’octobre 2026 a nommé Lula comme président pour un 4e mandat. D.Trump a pu prendre de nombreuses fois position dans ces élections, apportant son soutien clair au candidat d'extrême droite Flavio Bolsonaro, fils de Jair Bolsonaro, condamné pour tentative de coup d’État suite à sa défaite face au président Lula en 2023. Trump a proféré des menaces pour réclamer la fin du procès de Jair Bolsonaro</p>\n<p>Pour Trump, ces pays orientés politiquement à gauche représentent une menace à la sécurité nationale américaine car ils seraient une source d’immigration, et abriteraient des cartels de drogue. Selon lui, ces pays font preuve d’un anti-américanisme puissant et s’affilieraient au communisme. Autre point : Trump y voit aussi une possibilité pour la Chine d’étendre son influence sur l’Amérique Latine.  Cela se traduit par des menaces militaires contre le Panama dont le canal voit transiter des navires chinois. Sans oublier qu’En janvier 2026, le président venezuelien Nicolas Maduro a été capturé lors d’une opération américaine et le pouvoir mis en place à Caracas est désormais supervisé par les États-Unis qui s’impliquent directement dans la politique vénézuélienne.</p>\n<p>En outre Trump mène aussi des guerres commerciales en menaçant d’augmenter les droits de douane sur la Colombie et le Mexique. Ce dernier s’est d’ailleurs vu contraint de déployer des milliers de soldats à la frontière américaine sous la pression de Washington,  qui lui reproche l’afflux de Fentanyl aux Etats-Unis.</p>\n<p>À travers ces actions, se dessine clairement la vision qu’a Trump de l’Amérique Latine. Il la considère comme sa chasse gardée, n’y tolère aucune résistance, n’hésitant pas à utiliser sa place de puissance mondiale pour les faire flancher. Il apparaît évident que les États-Unis s’y intéressent aussi pour leurs possessions en matières rares. En effet, le Venezuela dispose d'importantes réserves de pétrole et le Brésil regorge d’importantes quantités de terres rares, extrêmement utiles au développement des nouvelles technologies. Si les États-Unis parviennent à avoir la mainmise sur ces ressources, ce n’est qu’un pas de plus vers l’indépendance des États-Unis vis-à-vis de la Chine  en matière de terres rares.</p>\n<h2 id=\"quitter-lotan-sans-quitter-leurope\">Quitter l’OTAN sans quitter l’Europe ?</h2>\n<p>Dès son premier mandat en 2017, Donald Trump affiche sa volonté de prendre ses distances avec l’Europe en menaçant de se désengager de l’OTAN. Il estime que cette alliance pèse beaucoup trop dans les dépenses américaines sans contrepartie suffisante. Pour Trump, les pays européens bénéficient de la protection des États-Unis sans payer une part équivalente aux services rendus. Il laisse donc planer la menace d’un possible retrait des États-Unis pour forcer l’Europe à augmenter son budget alloué à l’équipement et la formation des armées. De surcroît, Trump semble vouloir libérer des ressources financières et militaires américaines pour les consacrer dans sa guerre commerciale, économique et idéologique avec la Chine.</p>\n<p>Ainsi, Trump ne semble pas chercher à isoler complètement les États-Unis mais à limiter, voire supprimer des obligations diplomatiques et militaires envers l’Europe sans cesser d’exercer une pression politico économique.</p>\n<p>De manière générale, Trump affiche clairement son soutien aux partis de droite et surtout d’extrême-droite européens, c’est le cas notamment du Rassemblement National en France et de l’AfD en Allemagne.  Ce soutien passe notamment par des financements. Selon un article de Rfi, un fonds de 205 millions de dollars aurait même été créé pour favoriser la propagande des mouvements d’extrême-droite en Europe, qui promeuvent une idéologie et des idées proches de celles de Trump, notamment en matière d’immigration, accusables  de racisme, d’homophobie, de misogynie…</p>\n<p>On ne peut pas ne pas faire abstraction de la volonté de Trump de promouvoir un agenda anti immigration, que ses critiques qualifient de suprémaciste blanc, anti-immagratoire dans les pays de l’UE. Suite aux mouvement lycéens et aux nombreux blocus et manifestations, Trump n’hésite pas dès le 6 octobre commenter la situation en véhiculant comme toujours, un message anti-islam et anti-immigration dans le débat national français.</p>\n<blockquote>\n<p>« Ce qui se passe en France n’est rien d’autre qu’une immigration de masse hors de contrôle. Il ne s’agit pas des écoles, il s’agit de l’islam qui veut s’emparer d’un pays autrefois grand ! »</p>\n<p>— Tweet de Donald Trump, le 06/10/2026</p>\n</blockquote>\n<p>Sous prétexte de la recherche de la paix dans le conflit russo-ukrainien, Trump affiche un soutien de plus en plus marqué pour le président russe Vladimir Poutine. Cela passe par un allègement des pressions exercées sur la Russie et une défiance plus forte envers le président ukrainien Volodymyr Zelensky sur qui la pression ne fait qu’augmenter.</p>\n<p>En outre, un sommet États-Unis-Russie-Chine réunissant V.Poutine, D.Trump et Xi Jinping ( actuel président chinois) est t envisagé à Shenzhen, en Chine, avant la fin de 2026. Ce sommet devrait traiter de la fin de la guerre en Ukraine. Pourtant, aucun représentant ukrainien n’a été invité alors même qu’ils sont les premiers concernés. Certains experts parlent de “Conférence de Yalta 2.0” évoquant la réunion de février 1945 entre Winston Churchill ( Royaume-Uni) , Staline (URSS) et Franklin D. Roosevelt ( États-Unis) qui fut convoquée pour préparer l’après guerre.</p>\n<p>La conférence de Yalta originelle s’est tenue alors que les Alliés étaient certains de remporter le conflit en Europe, pour en négocier les termes. Or cette fois-ci, une possible victoire d’un des deux camps est encore très incertaine. Certes, l’armée aérienne ukrainienne semble mise à mal face à la Russie mais l’armée terrestre est encore très présente empêchant l’armée russe d’avancer sans difficulté sur le territoire ukrainien. Par cette initiative on observe une volonté excessive de Trump de redorer l’image de V.Poutine sur le plan international.  Ce fut également le cas à Anchorage en août 2025 lorsque Trump avait reçu Poutine pour s’exprimer et le prochain sommet du G20 qui aura lieu à Miami en décembre 2026 pourrait aller dans le même sens.</p>\n<p>Au-delà de cette volonté de réintégrer la Russie sur la scène internationale, Trump est parvenu à obtenir un accord de livraison de diesel russe après de multiples échanges téléphoniques, dont l’un des plus récents eut lieu le 9 octobre 2026. Cela met en lumière la volonté du président américain de privilégier ses intérêts  au mépris du droit international et de toute considération morale. En effet, Trump va même reprocher à V.Zelensky de ne pas chercher à faire d’efforts dans les négociations d’une paix, qui au passage avantagerait que les Russes, et appelle directement les Ukrainiens à “trouver un nouveau dirigeant”.</p>\n<h2 id=\"des-pressions-de-voisinage-aux-interventions-lointaines\">Des pressions de voisinage aux interventions lointaines</h2>\n<p>Plus que s’immiscer dans les affaires politiques des pays historiquement alliés ou historiquement assujettis, les États-Unis ont aussi un impact à l’échelle mondiale, et on constate que presque chaque guerre, voire même chaque nouvelle action politique a, de près ou de loin, un lien avec Trump et son administration.</p>\n<p>Au Canada et plus particulièrement au Québec, le gouvernement de Christine Fréchette, première ministre du Québec jusqu’au 21 octobre 2026, aurait été approché par des autorités américaines pour voir si le pouvoir en place était prêt à conclure des accords en échange desquels les droits de douanes seraient baissés notamment. Selon le ministre de la sécurité intérieure Ian Lafrenière, il s'agit là d’une ingérence dans les élections québécoises. À l’issue de celle-ci, le 5 octobre 2026, le parti indépendantiste québécois est arrivé en tête, toutefois sans obtenir la majorité avec seulement 28% des voix.  Le projet phare du parti indépendantiste québécois, dont le chef de parti est Paul St-Pierre Plamondon, est le référendum sur l’indépendance du Québec vis-à -vis du Canada. Ce projet a néanmoins été repoussé après le 20 janvier 2029, soit à la fin du mandat de Trump. Paul St-Pierre Plamondon explique que cette décision a été prise en raison de l’imprévisibilité de l'administration Trump, qui pourrait empêcher l’indépendance du Québec si toutefois elle était décidée. Néanmoins, ce décalage procure un risque important puisque selon Radio Canada , un gouvernement minoritaire ne tient pas plus de 18 mois. Or, il reste 3 ans avant la prochaine cérémonie d’investiture américaine.</p>\n<p>À environ 10000 kilomètres du Canada, se trouve l’Iran devenue depuis le 28 février 2026, la cible de frappes israélo-américaines. Le premier acte de ce conflit a été une opération aérienne conjointe ciblant des sites stratégiques militaires en Iran, suite à de nombreuses séries d’escalades entre l’Iran et Israël. Washington et Tel-Aviv ont justifié ces attaques principalement par la menace de l’avancement du programme nucléaire de Téhéran, présentant ces frappes militaires pour des frappes préventives, violant ainsi le droit international.  Du côté de l’administration Trump, un autre motif était de fragiliser le pouvoir théocratique iranien et de favoriser un changement de régime, dans un contexte de manifestations en Iran.</p>\n<p>Loin d’en avoir fini, ce samedi 31 octobre 2026, les États-Unis menacent de frapper une ou deux cibles en Iran, précisément au mont Kolang. Selon les renseignements américains, il s’agirait de complexes nucléaires à neutraliser. Trump fait passer ces actions militaires comme des “avancées démocratiques” dans l’optique de rallier les citoyens américains et d'éviter qu’ils ne protestent notamment face à la hausse de prix du pétrole.</p>\n<p>Toutefois, l’administration Trump se garde bien de rendre publiques toutes les opérations que l’armée américaine a entreprises. C'est le cas de l'attaque de l’île de Qeshm située dans le détroit d’Ormuz et dont les frappes américaines ont été tenues secrètement, à la veille des élections de mi-mandat.</p>\n<p>Trump ne cesse de surestimer ses capacités en affirmant que les attaques sur l’Iran pourraient s’achever en “dix minutes”, à en croire la déclaration du président américain ce 31 octobre 2026 depuis sa résidence en Floride. Selon une estimation du Pentagone publiée mi-octobre, le coût de la guerre en Iran pour les contribuables américains atteint 47,1 milliards de dollars, dû au renouvellement de munitions et à l’achat d'intercepteurs défensifs de missiles.</p>\n<p>Selon Suzanne Maloney, chercheuse à la Brookings Institution, on peut s’attendre à “davantage de frappes contre des infrastructures civiles [...] ayant un impact direct sur la population iranienne.” On peut également s’attendre à des pressions financières pour contraindre l’Iran à accepter des accords privilégiant les intérêts américains.</p>\n"

"body": "<h2 id=\"présentation-du-film\">Présentation du film</h2>\n<p>« C'est une jeunesse triste ». Solitude, recherche d'identité, désillusion, maladresse, amour, sexualité mais aussi déterminisme social, racisme, politique et même Parcoursup… Longue est la liste des sujets abordés par le film La Gradiva qui met en lumière notre jeunesse actuelle.</p>\n<p>Le film La Gradiva (“celle qui avance” en latin), premier film de Marine Atlan est sorti en salles fin octobre et il a incontestablement marqué les esprits de bon nombre de spectateurs !</p>\n<p>Marine Atlan filme l'adolescence avec réalisme oscillant entre sensualité et tragédie. Le film plonge les spectateurs dans le voyage scolaire d'une classe de terminale de banlieue parisienne à Naples. D'abord drôle et trivial, le ton de ce voyage se transforme progressivement, se chargeant d'inquiétude jusqu'à glisser peu à peu vers la tragédie. Au centre du récit se trouvent trois élèves : Toni, incarné par Colas Quignard, autour de qui gravitent Suzanne et James, et leur professeure de latin, Mme Mercier. Il s'agit ainsi d'un film choral dans lequel les trajectoires s'entremêlent.</p>\n<p>Pour écrire au plus près de cette génération, Marine Atlan et la coscénariste sont retournées dans l'ancien lycée de la réalisatrice. Elles y ont mené une vingtaine d'entretiens autour du désir, de l'avenir, du lycée ou encore de la santé mentale. Elles ont ensuite accompagné un véritable voyage scolaire suivant le même parcours que celui du film afin d'observer les relations, les disputes et le langage des adolescents.</p>\n<p>Quant au casting, mené pendant près de deux ans, il fait le parti pris de mettre en avant des visages encore peu connus du cinéma français, des parcours singuliers rencontrés au gré du hasard ou grâce à une story sur Instagram. La réalisatrice souhaitait retrouver la mixité sociale d'un lycée de banlieue et construire les personnages au contact des interprètes.</p>\n<h2 id=\"deux-temporalités\">Deux temporalités</h2>\n<p>Dans ce film, la réalisatrice fait se rencontrer deux temporalités : celle, fugace, de l'adolescence et celle, figée, des ruines de Pompéi. C'est ici que se cristallisent leurs émotions, notamment leur désir, leur vertige mais aussi leur colère face à un monde qui peine à les comprendre. Pompéi devient alors un territoire où se mêlent fantasme, révolte et non-dits. Cette fascination pour Pompéi traverse tout le film. Les corps pétrifiés, les photographies et les traces du passé questionnent ce qui reste d'un événement et ce que l'on projette sur lui. Pour Marine Atlan, les ruines font aussi écho à une société qui promet aux adolescents une égalité dont ils découvrent progressivement les limites.</p>\n<h2 id=\"une-ode-à-la-jeunesse\">Une ode à la jeunesse</h2>\n<p>Pour nous, ce film est une ode à la jeunesse moderne représentée. Il met en lumière des jeunes politisés, impliqués qui réfléchissent tout autant à leurs problèmes qu'à leur avenir et les enjeux qui les entourent. Pour cela, la technique du film est intéressante : dès la première scène, nous sommes placés au même niveau que les adolescents, nous partageons le même regard qu'eux. Cette proximité du regard permet aussi une plus grande connexion émotionnelle. Prenant place à côté d'eux pendant les dîners dans les restaurants typiques napolitains, on assiste à leur débat sans fin sur la politique, puis on s'invite dans leur chambre au plus près de leur intimité.</p>\n<p>L'adolescence est aussi un âge où l'on se construit sous, et parfois selon, le regard des autres. Le film interroge justement la manière dont les adolescents se racontent. Toni prend facilement la parole tandis que Suzanne peine davantage à trouver sa place. Tous deux se heurtent aux normes sociales, aux rapports de domination et aux codes du groupe, mais ils disposent de moyens différents pour tenter de s'en émanciper.</p>\n<p>Cette jeunesse, ce n'est pas un portrait fait par l'adulte qui l'a vécu, mais par l'adolescent qui le vit. Ce film est une tentative de faire saisir justement les émotions sur lesquelles on ne peut pas poser de mot juste. Cette émotion vécue par la jeunesse, il ne faut pas la quantifier, mais il faut la ressentir.</p>\n<h2 id=\"un-film-pré-révolte\">Un film “pré-révolte”</h2>\n<p>Ce film, c'est donc de la politique et une jeunesse impliquée pour l'avenir, en raisonnement avec les réclamations étudiantes actuelles. Selon l'acteur qui incarne James, Mitia Capellier-Audat, c'est même un film “pré-révolte” qui résonne pleinement avec les manifestations et blocus qui traduisent la colère d'une partie de la Gen Z. La Gradiva fait écho aux revendications de la jeunesse avant même le contexte actuel : ses revendications sont présentes et claires, elles ne sont pas apparues du jour au lendemain. La colère est tangible, il y a la conscience d'un système qui a ses failles, une société qui leur a imposé leur position, et qui ne prend pas en compte certaines de leurs problématiques.</p>\n<p>C'est surtout la question de l'éducation et des conditions de l'enseignement qui fait surface, avec des jeunes enclins à débattre de ce sujet et défendre un meilleur système pour tous.</p>\n<p>Dans le décor d'une pizzeria typique du style napolitain, les élèves se livrent à un débat sur la méritocratie, observée par leur professeure, ils marquent une rupture avec des préconçus et manifestent une réelle inquiétude pour leur futur professionnel, par exemple avec la mention de Parcoursup et la déception qu'il peut procurer à certains.</p>\n<h2 id=\"la-solitude-et-la-dépression\">La solitude et la dépression</h2>\n<p>La Gradiva, c'est donc la représentation de notre jeunesse moderne. Une jeunesse dans toute sa complexité, incarnée à travers ses problèmes quotidiens et les enjeux qui touchent sa génération. En surface, on trouve seulement des élèves en voyage, mais en se rapprochant de chacun d'eux, cette jeunesse décrite comme insouciante ou naïve se révèle en réalité profondément seule.</p>\n<p>Entre une bande son enivrante et une ville fourmillante, on se retrouve souvent plongés dans le bruit, un bruit pourtant qui peine à masquer cette solitude sous-jacente qui finit toujours par réapparaître. C'est la dépression latente, réalité inquiétante de notre génération, que la réalisatrice dépeint sans jamais prononcer ce mot. Les chiffres parlent d'eux-mêmes : 19 % des lycéens présentent un risque important de dépression en 2024, et 20 % déclarent avoir eu des pensées suicidaires au cours des 12 derniers mois.</p>\n<p>C'est ce qu'a voulu démontrer la réalisatrice : au-delà d'une mélancolie presque poétique qui se révèle sous nos yeux, c'est une souffrance bien plus grande qui se cache. Et cette douleur, elle s'incarne dans quasiment chacun des personnages, sous différentes manifestations. Suzanne avec une colère qu'elle exprime frontalement, James avec une attitude parfois passive ou en retrait quant Toni nous dévoile son mal-être progressivement, mais toujours seul.</p>\n<p>Pour accompagner cette solitude, c'est l'œil de la caméra qui nous l'indique en nous offrant de magnifiques plans où les personnages se retrouvent isolés du reste : Suzanne ou James dans le musée, Toni au bord de l'eau. Et les couleurs l'appuient, des tons chauds en groupe, mais plus froids pour refléter cette solitude.</p>\n<h2 id=\"recherche-didentité-amour-et-sexualité\">Recherche d'identité, amour et sexualité</h2>\n<p>Ce film, c'est une recherche sur tous les plans. On découvre, on essaye, on se trompe. Et cette quête perpétuelle passe par un questionnement d'identité chez les protagonistes. Comme avec Toni qui cherche à comprendre l'histoire de sa famille et de ses racines lors du voyage. Pour lui, ce voyage n'est pas seulement l'occasion de mieux se définir, mais aussi de trouver des réponses à des questions restées sans réponse.</p>\n<p>Cette recherche d'identité passe par son histoire, mais aussi par sa sexualité et la frontière parfois floue entre l'amour et l'amitié. Des questions sur ce qu'on accepte ou non dans une relation, le silence sur les amours qu'on n'ose pas déclarer, la jalousie aussi. Avec le personnage de James on remet aussi en question une certaine représentation de la masculinité. En mettant en avant ses propres désirs, il ne prend guère en compte le sentiment de ses partenaires, ni même d'écouter ses propres sentiments.</p>\n<p>On sent tout au long du film cette tension omniprésente et enivrante d'un désir constant et parfois refoulé.</p>\n<p>Mais cette recherche, elle souligne aussi l'émancipation de certains personnages qui tendent vers l'acceptation de soi : comme Suzanne, qui se sent mal dans sa peau et se plaint de son physique. Le mal-être est parfois pesant, faisant ressortir les doutes de chacun quant à sa place et son identité.</p>\n<p>Et finalement, ce sont des amitiés nouvelles qui se révèlent au grand jour : des jeunes liés par leur culture, leurs maux et leurs souffrances.</p>\n"
},

"sources": "<h3 id=\"institutions-rapports\">Institutions &amp; rapports</h3>\n<ul>\n<li>Haut Conseil à l'Égalité entre les femmes et les hommes — <em>Rapport 2026 sur l'état des lieux du sexisme en France : la menace masculiniste</em> — haut-conseil-egalite.gouv.fr</li>\n<li>Sénat — <em>Montée en puissance des réseaux et mouvements masculinistes</em> (Délégation aux droits des femmes et à l'égalité des chances) — senat.fr</li>\n<li>CEVIPOF, Sciences Po — <em>Le masculinisme, un tremplin vers des idéologies réactionnaires</em> — sciencespo.fr</li>\n</ul>\n<h3 id=\"médias-presse\">Médias &amp; presse</h3>\n<ul>\n<li><em>Le masculinisme, un tremplin vers des idéologies réactionnaires</em> (The Conversation) — theconversation.com</li>\n<li><em>En quête de politique</em> (France Inter, 23 mars 2025) — radiofrance.fr</li>\n<li><em>Qu'est-ce que la mouvance incel, cette composante masculiniste connue pour sa haine des femmes</em> (Libération, juillet 2025) — liberation.fr</li>\n<li><em>Mascus, les hommes qui détestent les femmes</em> (France.tv Slash) — france.tv</li>\n<li>Mélissa Blais — <em>&quot;Le masculinisme gagne du terrain car le féminisme est populaire et audible&quot;</em> (France Info) — franceinfo.fr</li>\n</ul>\n<h3 id=\"recherche-académique\">Recherche académique</h3>\n<ul>\n<li><em>Déconstruire la crise de la masculinité</em> (revue Mouvements, Cairn) — shs.cairn.info</li>\n</ul>\n",
"body": "<p>Des talons roses, un monologue inoubliable d'America Ferrera et une ode au féminisme, tout le monde se souvient de l'été 2023 marqué par la sortie du film <em>Barbie</em>. Et en 2026, qu'est-ce qu'on a eu ? Clavicular — un influenceur masculiniste américain — ridiculisé par les Françaises en pleine fête de la musique.</p>\n<h2 id=\"une-histoire-enchevêtrée-au-féminisme\">Une histoire enchevêtrée au féminisme</h2>\n<p>Mais d'où vient la montée récente de ces mouvements extrémistes ? Ont-ils toujours existé ou sont-ils seulement les conséquences des défaillances de nos sociétés ?</p>\n<p>Pour comprendre leurs origines, il faut remonter aux premiers mouvements féministes : leurs trajectoires sont étroitement liées. Selon la sociologue Mélissa Blais, le mouvement féministe a toujours été suivi de contre-mouvements visant à déstabiliser sa lutte. C'est ainsi que, dès le début du 19ème siècle, des textes de loi sont promulgués afin de priver les femmes de liberté : elles sont considérées comme mineures à vie et placées sous l'autorité d'un homme, leur père ou mari.</p>\n<p>Le début du 20ème siècle, lui, est marqué par la montée des mouvements féministes. Les années 1970 et 1980 sont empreintes d'une euphorie féministe très optimiste : une société future égalitaire commence à se dessiner peu à peu.</p>\n<p>Mais certains voient ces avancées d'un mauvais œil : les femmes commenceraient à posséder trop de pouvoir et à émasculer peu à peu les hommes. C'est la première « panique de la virilité », cette peur omniprésente chez les hommes de perdre leur pouvoir au profit de la gente féminine. Cette crainte est formalisée par la création en 1970 par F. Roger Devlin du Men's Rights Movement.</p>\n<p>Mais c'est seulement au cours des dernières décennies que ce mouvement devient omniprésent et de plus en plus extrémiste : les masculinistes gagnent du terrain.</p>\n<p>Selon Vincent Cocquebert, il existe un fort lien entre la crise économique de 2008 et la montée du masculinisme. En effet, c'est avant tout une crise symbolique qui a montré aux individus les limites de l'émancipation, du progrès et de l'égalité de nos sociétés. Les individus ont eu le sentiment de perdre le contrôle, de n'être plus maîtres de leur propre avenir. Or, simultanément, les jeunes femmes, plus diplômées et mieux armées sur le marché de l'emploi, ont symboliquement supplanté les hommes. C'est ainsi que la femme est apparue comme le bouc émissaire des hommes, la cause de leur malheur.</p>\n<p>Une solution évidente leur est alors apparue : reprendre du contrôle sur les femmes leur permettrait de regagner du contrôle sur leur propre vie.</p>\n<p>Quelques années plus tard, ce mouvement s'est davantage accéléré avec le hashtag #MeToo. En 2017, des femmes ont pris la parole concernant les violences sexuelles et sexistes commises par les hommes. Pour Pauline Gonthier, le masculinisme est également une réaction directe à ce mouvement : le slogan féministe « My body, my choice » est détourné en « Your body, my choice », dynamique ensuite amplifiée par des influenceurs et des figures comme Elon Musk, Trump ou Zemmour.</p>\n<p>Ainsi, le masculinisme est un courant qui s'est construit en opposition au féminisme et qui a su se nourrir des insécurités perpétuelles que nos sociétés engendrent. Mais si ce mouvement trouve un terreau aussi fertile dans nos sociétés, c'est parce qu'il répond à des souffrances bien réelles, dont les solutions et sources sont détournées.</p>\n<p>De nombreux signes montrent une grande souffrance masculine. Le décrochage scolaire est l'un des premiers symptômes : les jeunes hommes perdent de l'intérêt pour les institutions traditionnelles et veulent gagner de l'argent plus rapidement. Leur santé mentale se voit également grandement dégradée. Les chiffres sont flagrants : 75 % des suicides en France concernent des hommes. La construction sociale de la masculinité pousse les hommes à gérer seuls leur crise : les hommes peinent à verbaliser leurs émotions et s'en voient affectés. Cette « prison du genre » est donc une cause structurelle : cette souffrance masculine découle directement des normes de virilité imposées aux hommes dès l'enfance. C'est donc ce modèle qui enferme les hommes dans leur souffrance et les rend perméables aux discours masculinistes : la cause de tous leurs maux ne serait rien d'autre que le féminisme.</p>\n<blockquote>\n<p>L'antiféminisme n'est pas nouveau : à chaque période de l'histoire, il y a eu des oppositions aux luttes féministes. C'est le propre d'un contre-mouvement : il s'est adapté aux avancées du féminisme pour continuer à être audible.</p>\n</blockquote>\n<h2 id=\"une-violence-qui-se-retourne-contre-les-femmes-et-contre-les-hommes\">Une violence qui se retourne contre les femmes — et contre les hommes</h2>\n<h3 id=\"la-montée-dune-violence-anti-féminine\">La montée d'une violence anti-féminine</h3>\n<p>Toute cette histoire de l'origine du masculinisme se manifeste aujourd'hui sous plusieurs mouvements, plus ou moins accusateurs envers les femmes. Ivan Jablonka — écrivain et historien français — en identifie 3 degrés différents : la culture virile, la domination masculine et enfin, la réaction masculiniste.</p>\n<p>Pour lui, la culture virile désigne l'ensemble des attributs par lesquels l'homme se compose une culture. La domination masculine — ou le patriarcat — est la conviction de l'androcentrisme de la société, un monde où les hommes sont placés sous les projecteurs, considérés comme le centre du monde avec un monopole du pouvoir. Cette vision commence déjà à instaurer une hiérarchie et à évincer les femmes de la société. Enfin, le masculinisme forme, lui, le mépris entier contre les femmes qui souhaitent s'émanciper et gagner leur indépendance, en leur déniant leur droit à la liberté ou à la religion, par exemple. Cette libération féminine est vue comme un dérèglement du monde pour ces groupes, une déconstruction perçue comme une destruction. Pour certains, des femmes prenant le pouvoir sont synonymes de l'effondrement de notre société, un mythe parmi d'autres innombrables stéréotypes les concernant.</p>\n<p>Ensuite, le masculinisme se divise en plusieurs groupes aux convictions différentes mais ayant pour centre la femme. Stéphanie Lamy — spécialiste de la désinformation et militante féministe — nous explique le mouvement Red Pill. Inspiré du film <em>Matrix</em>, la pilule bleue représenterait le monde de la répression des hommes et où la pilule rouge serait celle de « l'éveil ». Mais que désigne exactement cet éveil ? Une nécessité de devenir plus fort que le féminisme ?</p>\n<p>D'autres mouvements misogynes sont, eux, centrés exclusivement sur les relations amoureuses avec les femmes. Les MGTOW — Men Going Their Own Way — prônent un célibat volontaire, tandis que les incels — involuntary celibate — développent une haine envers les femmes à cause du peu de succès qu'ils ont à leur égard, les plaçant comme responsables de leur échec amoureux ou insatisfaction sexuelle. Une de leurs convictions est la règle du 80/20 : 20 % des hommes les plus attirants monopolisent 80 % des femmes, rendant la tâche difficile pour le reste des hommes. Ou bien encore, la communauté des philogynes se retrouve en groupe afin de s'entraîner exclusivement à faire de la drague de rue, quitte à avoir un comportement lourd envers la femme qui ne devient plus qu'un objectif, un record.</p>\n<p>Enfin, certains groupes alertent sur la soi-disant nécessité de ne plus être un homme faible, d'être capable de se battre et réveiller leur masculinité en suivant des préparations physiques. La meute, menée par l'influenceur Azurr, en est un exemple, désignant rien qu'en son nom un besoin de devenir des mâles alpha en s'entraînant dans la forêt et en ingurgitant des discours de motivation, mais masculinistes.</p>\n<p>Cependant, l'ensemble de ces groupes part d'a priori et de stéréotypes discutables. Qu'est-ce qu'un homme faible ? Celui qui respecte la femme comme son égal ou qui la traite comme un humain à part entière ? Celui qui développe sa personnalité sans forcément suivre les préconceptions sociétales définies pour lui ?</p>\n<p>Ces discours représentent aujourd'hui un vrai danger, « une menace masculiniste », établie par le rapport annuel du Haut Conseil à l'égalité entre les femmes et les hommes récemment. Ce danger concerne autant ces discours misogynes faisant ralentir les progrès féministes, mais également les comportements violents qui se manifestent de plus en plus. L'attentat de Toronto en 2018, déclaré comme une rébellion incel, est un exemple de cette misogynie violente et politique. On peut également recenser la montée des féminicides ou des violences conjugales, qui résultent de ces idées de hiérarchies, de positions de pouvoir et de différenciation entre les femmes et hommes.</p>\n<h3 id=\"renfermement-des-hommes-dans-leurs-stéréotypes\">Renfermement des hommes dans leurs stéréotypes</h3>\n<p>Mais en plus de cette haine grandissante contre les femmes, ce mouvement radical est à double tranchant pour les hommes. Pour certains, le masculinisme est un moyen de réaffirmer leur pouvoir et leur rôle au sein de la société, en faisant notamment l'éloge d'un modèle familial hiérarchique entre les sexes. Plutôt simple à visualiser pour eux, l'homme doit protéger et la femme doit soigner son mari : « évidemment le rôle de la femme sera de prendre soin de son mari » — propos de LA MENACE. Bête comme chou.</p>\n<p>Mais pour d'autres, ce discours ne fait que les enfermer dans un moule qu'ils n'ont pas choisi. Cette prison de genre, c'est Ivan Jablonka qui nous l'explique. Elle constitue ce modèle de virilité qui oblige les hommes à se conformer par exemple à un mode de drague typiquement hétérosexuel, une consommation d'alcool importante ou des caractéristiques physiques comme la puissance ou la force : tout un ensemble de choses associées au « vrai homme ».</p>\n<blockquote>\n<p>Les hommes gagneraient à abandonner le modèle de la virilité obligatoire, qui est ringard et néfaste.</p>\n<p>— Ivan Jablonka</p>\n</blockquote>\n<p>Il développe cette idée en parallèle à la garçonnité, désignant le fait d'accepter ou non le programme culturel et social que la société propose quand on est un jeune de sexe masculin.</p>\n<p>En imposant ce genre de discours et d'attentes envers les hommes et leur devenir dans la société à des personnes vulnérables, le résultat en est effrayant. Certains peuvent se retrouver piégés dans des forums de discussion aux idées extrêmes envers les femmes, ou plus largement envers des ethnies. Comme expliqué précédemment, les groupes masculinistes peuvent également mener à des incitations à la violence, de comportements déplacés ou obscènes ou à des convictions idéologiques et politiques dangereuses. C'est notamment un phénomène qui se développe de plus en plus de nos jours par la multiplication des influenceurs masculinistes, rendant des hommes plus radicaux par leurs discours.</p>\n<p>Cela pose le problème d'un mal-être en perpétuelle croissance des hommes qui croient ne pas rentrer dans le moule du « vrai homme », de ne pas réussir à trouver cette place inventée qui leur était préconçue. C'est précisément là où les discours masculinistes représentent un danger sous-jacent. Ces personnalités offrent une réponse facile, caricaturale et mensongère aux problèmes de ces jeunes hommes, qui acceptent l'information et s'y conforment dans une satisfaction de comprendre leur mal-être plutôt que de le confronter à la réalité.</p>\n<p>Ivan Jablonka propose une explication à pourquoi certains hommes votent pour des leaders masculinistes, sans forcément rester sur la raison de la haine envers les femmes. D'après lui, le décrochage scolaire majoritaire des hommes est à prendre en compte : 40 % d'hommes présents en université contre 60 % de femmes aux États-Unis. Ainsi, l'éloignement de la vie culturelle intellectuelle et la déconnexion au monde sont des facteurs qui peuvent expliquer cette prise de mouvement par des hommes, et donc la nécessité de plus les sensibiliser au danger de ces idées.</p>\n<h2 id=\"un-mouvement-récupéré-par-le-pouvoir\">Un mouvement récupéré par le pouvoir</h2>\n<h3 id=\"un-cocon-vulnérable-aux-manipulations-politiques\">Un cocon vulnérable aux manipulations politiques</h3>\n<p>Mais ce renfermement des hommes sur eux-mêmes, cette forme de cocon — développée par Vincent Cocquebert — bien que fort et impénétrable en apparence, est en réalité bien plus vulnérable que jamais. Les ressentiments masculins et l'instabilité sur laquelle ils développent ces mouvements permettent aux politiques de les manipuler ouvertement. Les stratégies politiques et médiatiques rendent ce cocon perméable à certains discours.</p>\n<p>Donald Trump en est l'exemple le plus concret : il affiche des discours ouvertement antiféministes, rassemblant de nombreux disciples autour de ces idées. Et il est loin d'être le seul : la montée des mouvements d'extrême droite fait apparaître des figures ouvertement masculinistes. Éric Zemmour avec son pamphlet <em>Le Premier Sexe</em> ou encore Charlie Kirk, visage de la jeunesse trumpiste, assassiné en 2025, en sont des visages familiers.</p>\n<p>De plus, ces dernières années ont été le théâtre de retournements majeurs : Zuckerberg défilait aux côtés de la communauté LGBTQ+ avant de pivoter, et de nombreuses entreprises américaines ont ralenti leurs politiques de diversité et d'inclusion. On assiste à un retour en arrière, une véritable institutionnalisation de la misogynie, des discours qui ne se cachent plus.</p>\n<p>Le résultat : une polarisation majeure des votes, hommes et femmes ne votent plus de la même manière. Les politiques sont parvenus, à l'aide de ces discours toujours plus violents, à rallier des partisanes à leur cause. La fracture est profonde, et elle illustre un paradoxe central — l'intime se politise, mais le politique se sexualise aussi.</p>\n<h3 id=\"les-influenceurs-masculinistes\">Les influenceurs masculinistes</h3>\n<p>En plus de ces politiciens se réappropriant le mouvement masculiniste, les influenceurs restent les principaux canaux de la communication misogyne. Ces figures charismatiques des réseaux sociaux concentrent leur activité à tantôt apprendre aux hommes comment retrouver leur masculinité, étaler leurs opinions sur la place de la femme ou de l'homme, et même créer des guides entiers de conseils sur les relations à leur vision hiérarchique et sexiste.</p>\n<p>Aurélie Jean — scientifique et entrepreneuse — nous explique comment ces influenceurs se retrouvent dans nos contenus, par le concept d'algorithmes de recommandation. Ce processus s'appuie sur un algorithme de catégorisation d'utilisateurs, visant à trier les profils selon les contenus aimés, et ainsi nous recommander de nouveaux contenus que notre catégorie a elle-même aimé. Cela offre alors un biais de confirmation à l'utilisateur grâce à la récurrence de contenus qui vont lui être proposés et validés par sa catégorie.</p>\n<p>Cependant, il existe aussi le système d'occurrence, qui ne se base pas sur le contenu que l'on a apprécié ou non, mais plutôt sur ce qui a fait réagir les utilisateurs. Si on s'engage plus sur un contenu, celui-ci va être mis en avant peu importe les catégories. Ce genre de système fonctionne bien sur des contenus polémiques très partagés, et qui vont donc être plus vus, comme les vidéos des influenceurs masculinistes.</p>\n<p>Ces algorithmes posent ainsi le problème du manque de nuance sur les réseaux, qui nous poussent immédiatement à réagir plutôt qu'à réfléchir à ce qu'on voit ou entend, tendant à une polarisation des opinions.</p>\n<p>Mais justement, que font exactement ces influenceurs ? Sans compter les discours misogynes qu'ils répandent, ces personnes se considèrent comme des « motivateurs masculins ». Killian Sensei en fait partie, et bien d'autres encore sur YouTube. Son concept — l'Alpha Academy — est de créer une école pour devenir un nouvel homme en souscrivant à un abonnement pour accéder à des leçons.</p>\n<blockquote>\n<p>Les femmes indépendantes, féministes, c'est pas pour toi, c'est à fuir comme la peste.</p>\n</blockquote>\n<p>Ou bien encore Hugo Raverdy, autre influenceur proposant des formations masculinistes, couvertes par un soi-disant « développement de soi ».</p>\n<p>Ces marchands de misère prônent des leçons de vie sur les femmes en s'appuyant sur des notions scientifiques sans véritable source, raisonnant les relations comme de la chimie et en faisant payer ces formations à des prix exorbitants. Ceux de Hugo RF tournent entre 137 et 347 euros, mais les prix peuvent monter encore.</p>\n<p>Pour rappel, entre janvier 2021 et juillet 2022, la Commission des Citoyens pour les Droits de l'Homme notait une hausse de 59 % de l'utilisation de termes et de mots de code relatifs à des actes de violence de masse.</p>\n"

"sources": "<h3 id=\"médias-presse\">Médias &amp; presse</h3>\n<ul>\n<li>Guillaume Blanc — <em>La nature confisquée : histoire du colonialisme vert</em> (France Culture, Le Cours de l'histoire) — radiofrance.fr</li>\n<li><em>Le WWF accusé de financer des factions paramilitaires violentes</em> (Le Monde, 5 mars 2019) — lemonde.fr</li>\n<li><em>Peuples autochtones : ils dénoncent le &quot;colonialisme vert&quot; sur leurs terres</em> (France 24, Les Observateurs, octobre 2025) — france24.com</li>\n<li>Reportage sur le colonialisme vert en Afrique (BBC Afrique) — bbc.com</li>\n<li><em>Brazil: Accelerating deforestation of Amazon a direct result of Bolsonaro's policies</em> (Amnesty International, décembre 2020) — amnesty.org</li>\n<li>Guillaume Blanc — <em>&quot;Notre présent porte les marques indélébiles de l'histoire de la colonisation&quot;</em> (Les Champs Libres) — leschampslibres.fr</li>\n</ul>\n<h3 id=\"ressources-institutions\">Ressources &amp; institutions</h3>\n<ul>\n<li>Apartheid vert et colonialisme vert (Géoconfluences, ENS Lyon) — geoconfluences.ens-lyon.fr</li>\n<li>Site officiel du WWF France — wwf.fr</li>\n</ul>\n",
"body": "<h2 id=\"la-face-cachée-de-lécologie\">La face cachée de l'écologie</h2>\n<p>Sanctuariser la nature vierge ? Assurément. Expulser les personnes susceptibles de la dégrader ? Pourquoi pas, si c'est au nom de la préservation des espaces sauvages. C'est ce que l'on pourrait raisonnablement se dire. Après tout, cela relève d'une évidence morale que c'est l'humain, lui et nul autre, qui est l'auteur de cet anthropocène et qui devrait donc se retirer pour laisser la nature respirer.</p>\n<p>La réalité est néanmoins plus complexe : cette équation préservation = nature vidée de l'homme est en effet le fruit d'une construction historique. De fait, elle apparaît sous un certain angle comme un prétexte acceptable, car « verte », pour chasser des populations entières.</p>\n<p>Au XXᵉ siècle, ce sont entre 1 et 14 millions de personnes qui auraient été déplacées de force par les autorités pour construire des réserves ou des parcs nationaux, sur tous les continents, soit l'équivalent de la population de l'agglomération de Tokyo ou encore de Shanghai.</p>\n<p>L'historien Guillaume Blanc a conceptualisé ce phénomène en consacrant la notion de colonialisme vert, processus par lequel un ensemble de pratiques institutionnelles fabriquent cet idéal de nature vierge de toute présence humaine, au prix de l'effacement des populations locales.</p>\n<p>Mais alors, derrière l'apparente bonne volonté de ces ingérences au nom de la préservation, se cacherait-il un désir de dominer… ou bien même de coloniser ?</p>\n<h2 id=\"à-lorigine-du-mythe-le-fantasme-de-leden-africain\">À l'origine du mythe : le fantasme de l'Eden africain</h2>\n<p>Afrique. Dans l'imaginaire collectif occidental, le mot évoque spontanément l'image de la savane fascinante hors du temps, regorgeant d'animaux sauvages, en bref le décor du « Roi Lion ». Ce véritable paradis perdu, cet « eden » sans aucun soupçon de présence humaine où gambadent Pumbaa et Simba, représente quelque chose de précieux, à nos yeux, pour la nature. Et pourtant, n'en déplaise à certains, cette vision romantique d'une Afrique sauvage vierge de toute empreinte humaine n'est autre qu'une construction historique, un fantasme imposé progressivement mais certainement par les Occidentaux.</p>\n<p>C'est ce que nous dévoile Guillaume Blanc, historien spécialisé dans l'histoire environnementale de l'Afrique et professeur à Sciences Po Bordeaux. Son ouvrage <em>L'invention du colonialisme vert, pour en finir avec le mythe de l'Eden africain</em>, paru en 2020, nous dépeint toute la Genèse du phénomène, qui serait intrinsèquement lié à l'histoire de la colonisation, sans trop de surprise.</p>\n<p>Aux XVIIIᵉ et XIXᵉ siècles, les paysages du vieux continent s'imprègnent de la trace indélébile de l'industrialisation conjuguée à l'urbanisation, la pollution et la surexploitation de la nature. Ainsi, le capitalisme industriel ayant complètement ravagé leur nature, grandit chez les élites européennes une fascination pour une nature désormais perdue, supposément pure, intacte, inviolée. Naît alors un nouvel espoir : celui de retrouver cet « Eden perdu », et ce, sur les terres promises, les continents à « civiliser », les colonies.</p>\n<p>Mais alors, tout cela part d'une bonne volonté de la part des colons, vous diriez-vous. Or l'ironie est brutale : tandis que les Européens se présentent comme les « sauveurs » de cette nature, en la vidant de ses peuples considérés comme néfastes pour la nature qu'ils ont toujours habitée, ce sont eux-mêmes qui l'anéantissent. De fait, les puissances coloniales orchestrent l'exploitation massive des ressources africaines, rasent des millions d'hectares de forêts, exploitent la population, importent du bétail infesté d'autres continents causant ainsi des épidémies chez les animaux… Sans parler des dizaines de milliers d'éléphants abattus chaque année pour alimenter le commerce de l'ivoire. Ainsi, tout en accusant la population locale d'élément perturbateur de l'écosystème, les colons ont pillé, exploité, irréversiblement transformé la terre.</p>\n<p>Ce qu'il faut bien comprendre, selon Guillaume Blanc, c'est que cette « nature vierge de toute trace de l'homme » n'a jamais existé. C'est un mythe construit pièce par pièce ; car à son état naturel, sans l'ingérence des colons, la faune cohabite avec l'homme dans ces zones précises. Il est donc tout à fait paradoxal de prétendre retourner à l'état naturel en expulsant les autochtones. Et pourtant ces derniers, agriculteurs, pasteurs… sont étiquetés comme les nouvelles menaces des espaces naturels. Et c'est de là que naît la formule préserver = expulser les hommes, ou plutôt les Africains. D'ailleurs, selon l'anthropologue Philippe Descola, cette manière de se représenter le monde comme une dichotomie entre la nature et la culture est typiquement occidentale.</p>\n<blockquote>\n<p>Guillaume Blanc le résume ainsi : il s'agit pour les colons de « protéger l'Afrique des Africains ».</p>\n</blockquote>\n<p>Le colonialisme vert est né d'une obsession des Européens : celle de faire correspondre à la réalité une vision fantasmée d'un Eden africain.</p>\n<h2 id=\"décolonisation-et-naissance-dun-nouveau-système-de-domination\">Décolonisation et naissance d'un nouveau système de domination</h2>\n<p>C'est donc en quête d'une Afrique « protégée des Africains » que les colons vont inaugurer par force des réserves de chasses, puis des parcs naturels, s'octroyant ainsi un véritable droit de réappropriation de la nature.</p>\n<p>Néanmoins, tout bascule avec la décolonisation. Vers les années 60, survient une nouvelle crainte de la part des ex-colons, celle de perdre le contrôle de ces parcs naturels, de les voir s'« africaniser »…</p>\n<p>Il a donc fallu imaginer un nouveau système pour perpétuer cette domination, ou plutôt cette expulsion des Africains au nom de la préservation de l'environnement. Et quoi de mieux que de se présenter en tant qu'experts internationaux pour avoir son mot à dire sans être étiqueté comme « colon » ?</p>\n<p>Et c'est ainsi que sous l'impulsion de l'UNESCO et de l'IUCN qu'a été créé le WWF, le World Wide Fund, nouveau visage de cette « domination bienfaisante ». Ainsi, le colonialisme vert n'est pas une rupture avec l'époque coloniale mais une continuation réinventée par les Occidentaux dans l'optique de maintenir une mainmise sur des territoires jugés cruciaux pour leurs intérêts géopolitiques et économiques.</p>\n<p>On pourrait penser que depuis, cet esprit de « colonialisme » a pleinement eu le temps de s'estomper, pour laisser place à un activisme plus éthique en ce qui concerne l'harmonie avec la population locale. Que nenni. En 2019, le site d'informations breaking news américain BuzzFeed dévoile que le WWF aurait financé et armé des « écogardes » à l'origine destinés à lutter contre le braconnage. Ces unités se seraient métamorphosées en milices s'autorisant des violences barbares sur les populations locales : viol, torture, meurtres… et ce dans pas moins de 6 pays en Afrique et en Asie, profitant de leur position de domination. Qui se serait douté que le panda qui prétend vouloir construire un « avenir où les êtres humains pourront vivre en harmonie avec la nature » serait capable de tels agissements ?</p>\n<h2 id=\"le-cas-éthiopien-un-colonialisme-sans-colonisation\">Le cas éthiopien : un colonialisme sans colonisation</h2>\n<p>Guillaume Blanc avance notamment l'exemple du parc des Simien, en Éthiopie, où l'érosion des sols a été attribuée aux habitants locaux sur la base d'expertises plus que contestables et contestées. Ces études sont notamment fondées sur un rapport canadien datant de 1946 qui faisait état de 3 % de couvert forestier aux abords d'Addis-Abeba, sans réelle recherche et sur de simples estimations. L'ancien candidat à la présidentielle américaine et prix Nobel de la paix, Al Gore, a même repris cette étude pour accréditer l'idée que les paysans africains auraient détruit leurs terres.</p>\n<p>En 2016, l'UNESCO, aidée par le gouvernement éthiopien de l'époque, procède à l'expulsion de plus de 2500 personnes. Vivre dans un parc national reviendrait ainsi à vivre comme un squatteur, voire comme un étranger dans sa propre maison. Contrairement à cette étude, des chercheurs ont démontré que le couvert avait en réalité augmenté en deux siècles. On voit très bien que la logique est de déporter les problèmes environnementaux propres aux sociétés occidentales vers des zones géographiques précises en faisant passer des populations locales pour responsables d'une dégradation de leur habitat qu'elles n'ont, pour l'essentiel, pas causée…</p>\n<h2 id=\"une-préservation-controversée-à-tous-les-niveaux\">Une « préservation » controversée à tous les niveaux</h2>\n<p>Mais cette situation revêt une dimension particulièrement ironique : une fois les habitants expulsés, ces parcs « sanctuarisés » sont ouverts aux touristes, majoritairement occidentaux. Ce paradoxe est central dans l'analyse de Guillaume Blanc. Ces parcs nationaux sont aujourd'hui des vitrines écologiques lucratives qui donnent l'illusion d'une protection environnementale efficace et qui nous fait vite oublier qu'au-delà de ces frontières, les destructions écologiques continuent. Plus encore, le développement du tourisme renforce souvent la précarisation des populations déplacées, qui en deviennent dépendantes voire contraintes à la mendicité autour des zones protégées…</p>\n<p>Plus ironique encore, en fonction de si l'on se situe en Europe ou en Afrique, la population locale, notamment l'agropastoralisme, est tantôt valorisée, tantôt criminalisée. Lorsque le parc national des Cévennes, en France, est classé au patrimoine mondial de l'UNESCO, est saluée « l'adaptation harmonieuse entre l'homme et la nature ». On cherche ici à conserver les pratiques des paysans et des bergers sans jamais établir une quelconque nécessité pour ces personnes de devoir quitter leurs territoires. En Afrique, la présence humaine est au contraire perçue comme une dégradation sauvage de la nature, et les mêmes institutions exigent que les parcs soient vidés de leurs habitants, établissant ainsi un deux poids, deux mesures plus que flagrant.</p>\n<h2 id=\"un-phénomène-qui-népargne-aucun-continent\">Un phénomène qui n'épargne aucun continent</h2>\n<p>L'Inde en livre une illustration saisissante. Dans l'État du Karnataka, au sud du pays, les membres du peuple autochtone Jenu Kuruba ont vu leur terre ancestrale se faire arracher, ou plutôt se sont fait déraciner eux-mêmes de leurs terres. La raison ? La construction d'une réserve de tigres du Bengale, une espèce particulièrement menacée. Donc selon les dires des autorités, leur présence menacerait la biodiversité et compromettrait la protection du tigre du Bengale. Seulement, si l'on réfléchit bien, ces communautés vivent depuis des générations en interaction étroite avec cet environnement, et elles ont justement contribué à le préserver, de par leur mode de vie sobre et durable, bien avant l'émergence des politiques modernes de conservation. Et là réside la réalité dérangeante : ces espaces, une fois vidés de leurs habitants, deviennent des sanctuaires rentables, d'où la colère des Jenu Kuruba, qui y voient un outil de dépossession, à juste titre.</p>\n<p>Plus surprenant encore, le colonialisme vert n'épargne pas non plus le continent européen. Les Samis sont le seul peuple autochtone reconnu d'Europe. Répartis sur des territoires couvrant la Finlande, la Norvège, la Suède et la Russie, ils pratiquent notamment l'élevage traditionnel de rennes. Et eux aussi, au nom de la transition écologique, voient leur présence sur leurs territoires ancestraux menacée. En Norvège, c'est un projet d'exploitation minière lié à l'extraction de cuivre qui menace leur présence. Il s'agit là d'une ressource jugée stratégique pour la production de technologies dites vertes, parmi lesquelles les voitures électriques.</p>\n<p>Encore une fois, au nom de la lutte contre le changement climatique, des populations autochtones sont contraintes de supporter le coût environnemental et social d'un modèle économique pensé ailleurs. Or l'entreprise concernée a obtenu l'autorisation de déverser des déchets miniers toxiques dans un fjord voisin, illustrant les contradictions profondes de ce modèle.</p>\n<p>Spontanément, si nous isolions cet exemple européen du reste des cas, nous ne le désignerions pas comme « colonialisme vert ». Et pourtant, il en remplit tous les critères : nous retrouvons le dénominateur commun qu'est la marginalisation forcée des populations locales au nom du « vert ». Ce cas nous le confirme : le colonialisme vert dépasse la seule logique postcoloniale classique et s'impose comme une toute nouvelle forme de colonialisme.</p>\n<h2 id=\"à-qui-la-responsabilité\">À qui la responsabilité ?</h2>\n<p>Le colonialisme vert permet d'illustrer une fois de plus le fait que fatalement, ceux qui subissent le plus durement et injustement les politiques coercitives de conservation de la planète ne sont pas ceux qui en sont responsables. Loin de là. Dans notre cas précis, il s'agit de peuples autochtones, dont le mode de vie repose sur une exploitation sobre et durable des ressources, et dont l'empreinte carbone ne serait que poussière comparée à la nôtre. Il y a donc un vrai renversement des responsabilités.</p>\n<p>Et puis, au-delà de la question de la responsabilité, ne devrait-on pas changer nos représentations ? Abandonner notre double standard qui tolérerait l'harmonie humain/nature en Europe mais pas ailleurs ?</p>\n<p>Alors, comme le dit Aimé Césaire :</p>\n<blockquote>\n<p>« Une civilisation qui s'avère incapable de résoudre les problèmes que suscite son fonctionnement est une société décadente. Une civilisation qui choisit de fermer les yeux à ses problèmes les plus cruciaux est une civilisation atteinte. Une civilisation qui ruse avec ses principes est une civilisation moribonde. »</p>\n</blockquote>\n<p>Ne serait-il pas grand temps que la civilisation humaine elle aussi applique à elle-même ce qu'elle prétend défendre ? Peut-être que le plus urgent n'est pas de sauver une nature fantasmée, mais d'abord de réapprendre à penser une coexistence plus juste entre l'humain et la nature.</p>\n"

015) — slate.fr</li>\n<li>L'Inde en quête de productivité : travailler plus ou travailler mieux ? (Le Petit Journal Bombay, janvier 2025) — lepetitjournal.com</li>\n</ul>\n<h3 id=\"données-statistiques\">Données statistiques</h3>\n<ul>\n<li>Santé Publique France — Baromètre de Santé publique France 2024 (temps de sommeil, courts dormeurs, plainte d'insomnie, données socio-économiques et régionales) — santepubliquefrance.fr</li>\n<li>INSEE — Enquête sur le travail de nuit 2012 (−1h40 de sommeil pour les travailleurs de nuit)</li>\n<li>OMS / OIT — Étude sur le surmenage et les risques cardiovasculaires (risque AVC +35% au-delà de 55h/semaine)</li>\n<li>Organisation Internationale du Travail — Données sur le travail de nuit en France et en Inde</li>\n<li>INSV / OpinionWay — Enquête sur le sommeil des Français, réalisée décembre 2025, publiée le 10 mars 2026 (26e Journée du sommeil) — institut-sommeil-vigilance.org</li>\n<li>Pascale Santi — &quot;6h50 par nuit en moyenne : le temps de sommeil ne cesse de reculer en France&quot; (Le Monde, 10 mars 2026) — lemonde.fr</li>\n<li>Ministère de la Santé — Feuille de route interministérielle sur le sommeil, juin 2025 — sante.gouv.fr</li>\n<li>Jean-Arthur Micoulaud-Franchi (CHU de Bordeaux, président du conseil scientifique de l'INSV) — cité in Pascale Santi, Le Monde, 10 mars 2026</li>\n<li>Léger D., Zeghnoun A., Faraut B., Richard J.B. — &quot;Le temps de sommeil, la dette de sommeil… des 18-75 ans : résultats du Baromètre de Santé publique France 2017&quot; — Bull Épidémiol Hebd. 2019;(8-9):149-60</li>\n</ul>\n<h3 id=\"références-philosophiques-mobilisées\">Références philosophiques mobilisées</h3>\n<ul>\n<li>Karl Marx — <em>Le Capital</em> (&quot;barrière naturelle&quot;, &quot;anéantissement de l'espace par le temps&quot;)</li>\n<li>Hannah Arendt — <em>Condition de l'homme moderne</em> (équilibre exposition publique / retrait protégé)</li>\n<li>John Locke — <em>Essai sur l'entendement humain</em> (le sommeil comme &quot;interruption regrettable&quot;)</li>\n<li>Arthur Schopenhauer — <em>Le Monde comme volonté et comme représentation</em> (&quot;le vrai noyau de l'existence humaine&quot;)</li>\n<li>Michel Foucault — <em>Surveiller et punir</em> (dispositif, biopouvoir — mobilisés via Crary)</li>\n</ul>\n",
"body": "<p>Quelque part dans un laboratoire de l'université du Wisconsin, des chercheurs financés par le Pentagone disséquent le cerveau d'un bruant à gorge blanche. Ce petit oiseau migrateur a une capacité étrange : il peut rester éveillé sept jours d'affilée sans déficit cognitif mesurable. Les militaires américains veulent comprendre comment. À court terme, ils espèrent créer un soldat capable de combattre une semaine sans dormir. À long terme, c'est autre chose qu'ils visent. C'est nous.</p>\n<p>Cette anecdote, documentée par le philosophe Jonathan Crary dans son essai <em>24/7</em>, n'a rien d'une métaphore. Elle dit littéralement ce que le capitalisme fait à la nuit depuis deux siècles. Il la considère comme un problème à résoudre. Un obstacle. Une interruption inacceptable dans la logique de production continue. Et quand on ne peut pas l'éliminer, on peut au moins l'éroder, la fragmenter, la rendre marchande, jusqu'à ce qu'elle ne soit plus tout à fait la nuit.</p>\n<h2 id=\"la-nuit-avait-une-forme\">La nuit avait une forme</h2>\n<p>Avant la révolution industrielle, la nuit n'était pas simplement l'absence de jour. Elle avait une structure propre. L'historien Roger Ekirch a passé vingt ans à compiler des journaux intimes, des dépositions judiciaires, des traités médicaux d'Europe préindustrielle. Il y a découvert quelque chose que nous avons entièrement oublié. Les humains dormaient en deux temps. Un premier sommeil de quatre heures environ, puis une période de veille méditative qu'on appelait le &quot;dorveille&quot;, une heure ou deux, puis un second sommeil jusqu'à l'aube. Durant ce dorveille, on priait, on faisait l'amour, on discutait des rêves qu'on venait de faire, parfois on lisait. Ce n'était pas de l'insomnie. C'était simplement la forme naturelle du repos humain quand il n'y avait pas de lumière artificielle.</p>\n<p>Ce sommeil discontinu a disparu en l'espace de quelques décennies au XIXe siècle, au moment où l'éclairage artificiel s'est répandu dans les villes industrielles. La lampe à gaz, puis l'ampoule électrique, ont réinitialisé le rythme circadien des ouvriers. Couchers plus tardifs, sommeils plus courts, plus fragmentés. Ce n'était pas un progrès biologique. C'était une adaptation forcée aux exigences de la fabrique. Et il faut le dire sans nostalgie : la nuit préindustrielle n'était pas un âge d'or. Les paillasses étaient infestées de puces, le froid était partout, la mortalité infantile effrayante. Ekirch lui-même note que les gens modestes devaient vivre dans un état de fatigue chronique. Ce que nous avons perdu n'est pas un confort. C'est une structure biologique adaptée à nos corps.</p>\n<blockquote>\n<p>Le capitalisme ne déteste pas le sommeil parce qu'il est inutile. Il le déteste parce qu'il est le seul espace où l'être humain ne produit rien, ne consomme rien, ne peut pas être atteint.</p>\n</blockquote>\n<p>Deux philosophes permettent de mesurer l'ancienneté de ce mépris. John Locke, père du libéralisme politique, voyait déjà au XVIIe siècle le sommeil comme une &quot;regrettable interruption dans l'accomplissement des priorités assignées aux hommes par Dieu&quot;. Une formule qui préfigure presque mot pour mot la rhétorique managériale d'aujourd'hui. Schopenhauer, à l'inverse, aura l'audace de retourner la hiérarchie : c'est dans le sommeil, disait-il, que se trouve &quot;le vrai noyau de l'existence humaine&quot;. Le capitalisme industriel n'a jamais hésité entre ces deux pôles. Marx l'avait déjà compris : le sommeil est la dernière &quot;barrière naturelle&quot; à sa pleine réalisation. Crary le confirme deux siècles plus tard. Il est toujours possible de la saccager.</p>\n<h2 id=\"la-fabrique-de-linsomnie\">La fabrique de l'insomnie</h2>\n<p>Un tableau de 1782 résume mieux que n'importe quel traité ce qui s'est passé. Joseph Wright of Derby a peint <em>Les filatures de coton d'Arkwright, la nuit</em>. Une usine illuminée sous un clair de lune, ses fenêtres brillant d'une lumière artificielle qui concurrence les étoiles. On présente souvent cette image, reproduite dans des dizaines de manuels d'histoire économique, comme une célébration du progrès industriel. Crary y lit autre chose : l'annonce d'un temps abstrait, détaché des cycles naturels, où la production peut théoriquement ne jamais s'arrêter. La lune est encore là dans le tableau. Mais elle a déjà perdu.</p>\n<p><img src=\"../analyse-nuit-filature-wright.jpg\" alt=\"Les filatures de coton d'Arkwright la nuit, peinture de Joseph Wright of Derby (vers 1782-83)\"></p>\n<p><em>Les filatures de coton d'Arkwright, la nuit — Joseph Wright of Derby, vers 1782-83. L'usine illuminée rivalise avec le clair de lune : la première image d'un monde où la production ne s'arrête plus jamais. Huile sur toile · Domaine public — via WikiArt</em></p>\n<p>Ce temps abstrait, Crary l'appelle le &quot;temps 24/7&quot;. Ce n'est pas une métaphore, c'est une description littérale. Un monde où les marchés ne ferment plus, où les flux d'information ne s'interrompent jamais, où la frontière entre jour et nuit a fini par être dissoute. L'expression &quot;Open 24/7&quot; n'est pas un simple argument commercial. C'est un programme anthropologique : l'être humain comme terminal toujours actif, qui ne se déconnecte jamais vraiment.</p>\n<p>Ce programme a une généalogie concrète. Depuis les années 1980, la cocaïne et ses dérivés amphétaminiques permettent aux traders de Wall Street de prolonger leur présence au marché. Les jeunes analystes de Goldman Sachs dorment sous leur bureau, littéralement. Un stagiaire de 21 ans, Moritz Ehrardt, meurt en 2013 d'une crise d'épilepsie dans sa douche, après soixante-douze heures de travail consécutives. Thomas Hughes, 29 ans, banquier en fusion-acquisition, se défenestre en 2015 après des nuits à base d'alcool et de cocaïne. Goldman Sachs finit par &quot;réformer&quot; ses pratiques : les jeunes employés ne doivent plus être au bureau le vendredi soir après 21h. Le week-end, ils peuvent toujours travailler depuis chez eux.</p>\n<h2 id=\"la-colonisation-légale-de-la-nuit\">La colonisation légale de la nuit</h2>\n<p>Ce qui s'est passé dans les grands magasins parisiens depuis les années 1990 est un cas d'école. Les Galeries Lafayette, le Printemps, Sephora, Virgin Mégastore ont commencé à ouvrir de plus en plus tard le soir. D'abord une nocturne par semaine, puis deux, puis jusqu'à minuit, sept jours sur sept. Illégalement, au regard du Code du travail.</p>\n<p>Les syndicats ont bataillé. Le comité intersyndical du commerce de Paris a traîné Sephora et les Galeries Lafayette devant les tribunaux au début des années 2010. Et a gagné. Les juges ont interdit les nocturnes. Mais la victoire judiciaire a immédiatement déclenché la réaction politique. Bernard Arnault, PDG de LVMH, propriétaire de Sephora, a acheté des pages entières dans Le Figaro et Le Parisien pour dénoncer les syndicats. Des employées ont pleuré à l'audience. La direction a fait signer une pétition. En 2015, la loi Macron a fini par inventer une nouvelle catégorie juridique : le &quot;travail en soirée&quot;, distinct du travail de nuit, moins encadré, applicable dans les &quot;zones touristiques internationales&quot;.</p>\n<blockquote>\n<p>Ils n'ont pas conquis la nuit par la force. Ils l'ont d'abord pratiquée illégalement, puis attendu que la loi suive.</p>\n</blockquote>\n<p>La sociologie de ce qui se joue là est précise. Les salariés qui travaillent ces nocturnes ne sont pas les cadres. Ce sont les femmes à temps partiel, les étudiants en CDD, les agents de sécurité, les manutentionnaires. En France, 16,3% de la population active est exposée au travail de nuit. Et les catégories les plus concernées restent, dans leur grande majorité, les moins bien payées. Le travail de nuit n'est pas une contrainte partagée équitablement. C'est une extraction qui porte sur les corps de ceux qui n'ont pas les moyens de refuser.</p>\n<h2 id=\"la-privatisation-du-sommeil\">La privatisation du sommeil</h2>\n<p>L'employeur et la plateforme numérique convergent vers la même heure volée, et ce n'est pas un hasard. Ils visent la même ressource. Le temps biologique non encore monétisé, ces heures où le corps devrait se régénérer, voilà la dernière frontière commune à l'entrepôt Amazon et à l'algorithme de Netflix. L'un opère via le droit du travail. L'autre via l'attention economy. Mais la cible reste identique. Extraire du temps humain au-delà de ce que le corps peut raisonnablement donner.</p>\n<p>Netflix a publiquement déclaré que son principal concurrent n'était pas HBO, ni même Amazon. C'était le sommeil de ses utilisateurs. Reed Hastings, son fondateur, a formulé la stratégie avec une franchise glaçante : &quot;We're competing with sleep.&quot; Les algorithmes des plateformes sont conçus, scientifiquement, pour rendre le moment de déposer l'écran plus difficile que celui de le saisir. Chaque notification, chaque autoplay, chaque &quot;prochain épisode dans 5 secondes&quot; attaque directement l'endormissement.</p>\n<p>44% des jeunes hommes français de 15 à 19 ans ont déjà réduit volontairement leur temps de sommeil pour rester plus longtemps sur leur téléphone. Le phénomène a un nom, apparu en Chine et à Taïwan à la fin des années 2010 : la &quot;revenge bedtime procrastination&quot;, la procrastination de vengeance à l'heure du coucher. Des millions de travailleurs, épuisés par des journées de dix à douze heures, refusent d'aller dormir malgré la fatigue. Parce que ces deux heures nocturnes sur leur téléphone sont les seules qu'ils vivent vraiment pour eux. C'est une forme de résistance. C'est aussi un piège. Ils finissent par céder ces heures de récupération aux plateformes qui les ont épuisés en premier lieu.</p>\n<p>Crary compare ce mouvement à la privatisation de l'eau. L'eau en bouteille a transformé un bien commun en produit marchand en créant artificiellement de la rareté. Les industries numériques font exactement la même chose avec le sommeil : elles créent la rareté, puis vendent des solutions pour y remédier. La France est le deuxième consommateur de somnifères en Europe. Ces substances ne permettent pas vraiment de dormir. Elles permettent surtout d'oublier qu'on ne dort pas. Le marché crée le problème, vend le palliatif, et comptabilise les deux comme de la croissance.</p>\n<h2 id=\"linégalité-par-la-nuit\">L'inégalité par la nuit</h2>\n<p>Ce que révèle la sociologie du sommeil, c'est que la privation de nuit n'a rien d'universel. Elle est profondément inégalitaire. Les chiffres du baromètre de Santé publique France 2024 sont implacables sur ce point : le taux de courts dormeurs passe de 15,4% chez les personnes financièrement à l'aise à 29% chez celles en difficulté. Le double. 27% des ouvriers sont concernés. Dès la grande section de maternelle, les enfants d'ouvriers dorment déjà dix minutes de moins que les enfants de cadres. Et parmi les personnes souffrant d'insomnie chronique, 45,8% se trouvent en difficulté financière. Le psychiatre Jean-Arthur Micoulaud-Franchi résume le mécanisme d'une phrase : le sommeil est à la fois un symptôme et un facteur aggravant des problèmes de santé. Un cercle vicieux presque parfait. La précarité détruit le sommeil, et le manque de sommeil aggrave la précarité.</p>\n<p>Ce gradient social se retrouve à l'échelle mondiale, avec une brutalité encore plus visible dans les économies en développement. En Inde, où 51% de la main-d'œuvre travaille plus de 49 heures par semaine, le PDG de Larsen &amp; Toubro a demandé publiquement à ses employés de travailler 90 heures par semaine. Lors d'une réunion filmée, il a même ajouté : &quot;Que faites-vous assis à la maison ? Combien de temps pouvez-vous regarder votre femme ?&quot; La mort d'Anna Sebastian Perayil, comptable de 26 ans chez Ernst &amp; Young à Pune, décédée quatre mois après son embauche d'un épuisement lié à sa charge de travail, a provoqué une enquête gouvernementale. Ce n'est pas un phénomène exotique. C'est l'aboutissement logique d'une culture du travail sans limite que l'Occident a exportée avec le reste de son modèle économique.</p>\n<p>Le mythe du dirigeant qui dort peu fait partie de la même idéologie. Trump se vantait de dormir quatre heures. Macron, de &quot;dormir peu&quot;. Thatcher dormait cinq heures. Le message est toujours le même : la privation de sommeil serait un choix héroïque chez les puissants, une faiblesse chez les autres. Le constat scientifique dit l'inverse. L'OMS et l'OIT documentent qu'au-delà de 55 heures de travail par semaine, le risque d'AVC augmente de 35% et celui de maladie cardiaque ischémique de 17%. Burn-out, dépression, obésité, diabète de type 2. Tous ces troubles ont une corrélation robuste avec la privation chronique de sommeil, documentée par le baromètre Santé publique France. La santé des travailleurs reste la dernière variable que le capitalisme accepte d'optimiser.</p>\n<h2 id=\"le-sommeil-comme-acte-politique\">Le sommeil comme acte politique</h2>\n<p>Il serait tentant de conclure sur une note de résistance romantique. Dormir comme acte révolutionnaire, la sieste comme grève. Ce serait insuffisant. Ce que la lecture de Crary, d'Ekirch, de Klotz et des sociologues du travail nocturne permet de comprendre, c'est que la question du sommeil n'a rien d'individuel. Elle est structurelle. Elle appelle des réponses collectives.</p>\n<p>La proposition d'inscrire un droit au sommeil dans la Constitution, formulée par le politiste Paul Klotz, n'a rien d'une fantaisie. Elle s'inscrit dans la lignée directe des luttes ouvrières du XIXe siècle, celles qui ont arraché la journée de huit heures, le repos dominical, l'interdiction du travail de nuit des enfants. Ces combats paraissaient utopiques à l'époque. Il leur a fallu un siècle pour se concrétiser. Et aujourd'hui, ils sont en train d'être progressivement défaits par les ordonnances Macron de 2017, qui ont facilité les accords d'entreprise dérogatoires, par la banalisation des horaires atypiques, par une désyndicalisation qui laisse les salariés seuls face à leurs plannings. En 2026, selon la feuille de route interministérielle sur le sommeil publiée en juin 2025, plus de 30% des enfants et jusqu'à 70% des adolescents ne dorment pas suffisamment. L'État le sait. Il n'en a pas encore fait une priorité politique.</p>\n<p>Hannah Arendt insistait sur l'équilibre nécessaire entre exposition publique et retrait protégé, entre la lumière de la polis et l'obscurité du foyer. Le capitalisme de plateforme a détruit cet équilibre en absorbant à la fois la sphère privée et la possibilité de régénération. La chambre à coucher est devenue un espace de travail, de consommation, de surveillance. Il n'y a plus vraiment de retrait possible. Seulement un mode veille.</p>\n<p>Et pourtant. Quelque chose dans le sommeil résiste encore. C'est le seul état humain qui ne peut pas être délégué, simulé, optimisé à l'infini. On ne peut pas dormir pour quelqu'un d'autre. On ne peut pas dormir plus efficacement au-delà d'un certain seuil. Le corps a ses propres exigences, et elles restent incompressibles. C'est précisément pour ça que le capitalisme le déteste. Et c'est précisément pour ça que ça vaut la peine de le défendre.</p>\n"
